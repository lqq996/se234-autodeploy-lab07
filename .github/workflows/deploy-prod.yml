name: deploy prod
on:
  push:
    branches:
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: upload prod
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: lqq
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: ./html/*
          target: /var/www/html/prod
          strip_components:1